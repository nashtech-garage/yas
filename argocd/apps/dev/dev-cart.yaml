apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-cart
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/luc1fe4/yas.git'
    targetRevision: 'gitops-dev'
    path: k8s/charts/cart
    helm:
      parameters:
        - name: backend.image.tag
          value: '88f6c0b6'
        - name: backend.image.repository
          value: 'besukem/cart'
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
