apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-backoffice-bff
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/luc1fe4/yas.git'
    targetRevision: 'gitops-dev'
    path: k8s/charts/backoffice-bff
    helm:
      parameters:
        - name: backend.image.tag
          value: '8b3e1df2'
        - name: backend.image.repository
          value: 'besukem/backoffice-bff'
        - name: backend.ingress.host
          value: 'backoffice.dev.yas.local.com'
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
