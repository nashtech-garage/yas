# ============================================================
# AuthorizationPolicy - Service-to-Service Access Control
# ============================================================
# Chiến lược: DENY-BY-DEFAULT + ALLOW-LIST
# 1. Policy "deny-all" → deny tất cả traffic không được phép
# 2. ALLOW policy cho từng service cụ thể
# ============================================================

# --- DENY-ALL Default Policy ---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all-default
  namespace: yas
  labels:
    app.kubernetes.io/part-of: yas
spec:
  {}

---
# --- ALLOW: Product Service ---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-product-access
  namespace: yas
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: product
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/yas/sa/storefront-bff"
              - "cluster.local/ns/yas/sa/backoffice-bff"
              - "cluster.local/ns/yas/sa/default"
              - "cluster.local/ns/yas/sa/order"
              - "cluster.local/ns/yas/sa/cart"
              - "cluster.local/ns/yas/sa/search"
              - "cluster.local/ns/yas/sa/recommendation"
              - "cluster.local/ns/yas/sa/inventory"
              - "cluster.local/ns/yas/sa/promotion"
              - "cluster.local/ns/yas/sa/rating"
              - "cluster.local/ns/yas/sa/sampledata"
      to:
        - operation:
            ports: ["80"]

