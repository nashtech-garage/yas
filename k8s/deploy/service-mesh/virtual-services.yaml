# ============================================================
# VirtualService - Retry Policies cho YAS Services
# ============================================================
# Cấu hình retry tự động khi service trả về lỗi 5xx.
#
# Retry policy:
#   - retryOn: 5xx, connect-failure, refused-stream, reset
#   - attempts: 3 (retry tối đa 3 lần)
#   - perTryTimeout: 5s (timeout mỗi lần retry)
#   - retryRemoteLocalities: true (retry tới pod khác nếu có)
#
# Timeout:
#   - timeout tổng: 30s cho mỗi request
# ============================================================

# --- Product Service Retry ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: product-retry
  namespace: yas
  labels:
    app.kubernetes.io/part-of: yas
    app.kubernetes.io/managed-by: istio
    purpose: retry-policy
spec:
  hosts:
    - product.yas.svc.cluster.local
  http:
    - route:
        - destination:
            host: product.yas.svc.cluster.local
            port:
              number: 80
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: "5xx,connect-failure,refused-stream,reset"
        retryRemoteLocalities: true

