kafka:
  replicas: 1
  kraftMode: false  # true = KRaft (Strimzi 0.36+), false = ZooKeeper (Strimzi 0.35.x with debezium image)
zookeeper:
  replicas: 1
  storeSize: 5Gi
postgresql:
  username: yasadminuser
  password: admin
debeziumConnect:
  image: ghcr.io/nashtech-garage/debezium-connect-postgresql:latest
  buildImage: false #Enabled when build debezium-connect-postgresql image