# ArgoCD NodePort patch
# Expose ArgoCD server on NodePort 30088 (HTTP, insecure mode for local dev)
# Same port is pre-mapped in k3d AND must be opened on real laptops
#
# Usage: kubectl apply -f k8s/deploy/argocd/argocd-nodeport-patch.yaml
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30088
    - name: https
      port: 443
      targetPort: 8080
      nodePort: 30443
  selector:
    app.kubernetes.io/name: argocd-server
