apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yas-bff-api-routes
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: {{ required "hosts.api is required" .Values.hosts.api | quote }}
      http:
        paths:
          - path: /api/product(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: product
                port:
                  number: 80
          - path: /api/cart(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: cart
                port:
                  number: 80
          - path: /api/customer(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: customer
                port:
                  number: 80
          - path: /api/inventory(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: inventory
                port:
                  number: 80
          - path: /api/media(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: media
                port:
                  number: 80
          - path: /api/order(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: order
                port:
                  number: 80
          - path: /api/tax(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tax
                port:
                  number: 80