apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-nginx-config
  namespace: {{ .Release.Namespace }}
data:
  default.conf: |
    server {
      listen 80;

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location = / {
        access_log off;
        return 200 "ok\n";
      }

      # Storefront/backoffice calls /api/<service>/...
      # Internal nginx rewrites:
      # /api/product/...    -> /product/...
      # /api/cart/...       -> /cart/...
      # /api/search/...     -> /search/...
      # /api/sampledata/... -> /sampledata/...

      location ~ ^/api/product/?(.*)$ {
        rewrite ^/api/product/?(.*)$ /product/$1 break;
        proxy_pass http://product;
      }

      location ~ ^/api/cart/?(.*)$ {
        rewrite ^/api/cart/?(.*)$ /cart/$1 break;
        proxy_pass http://cart;
      }

      location ~ ^/api/customer/?(.*)$ {
        rewrite ^/api/customer/?(.*)$ /customer/$1 break;
        proxy_pass http://customer;
      }

      location ~ ^/api/inventory/?(.*)$ {
        rewrite ^/api/inventory/?(.*)$ /inventory/$1 break;
        proxy_pass http://inventory;
      }

      location ~ ^/api/media/?(.*)$ {
        rewrite ^/api/media/?(.*)$ /media/$1 break;
        proxy_pass http://media;
      }

      location ~ ^/api/order/?(.*)$ {
        rewrite ^/api/order/?(.*)$ /order/$1 break;
        proxy_pass http://order;
      }

      location ~ ^/api/tax/?(.*)$ {
        rewrite ^/api/tax/?(.*)$ /tax/$1 break;
        proxy_pass http://tax;
      }

      location ~ ^/api/search/?(.*)$ {
        rewrite ^/api/search/?(.*)$ /search/$1 break;
        proxy_pass http://search;
      }

      location ~ ^/api/sampledata/?(.*)$ {
        rewrite ^/api/sampledata/?(.*)$ /sampledata/$1 break;
        proxy_pass http://sampledata;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: internal-nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-nginx
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-nginx
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: nginx-config
          configMap:
            name: internal-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: internal-nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: internal-nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http