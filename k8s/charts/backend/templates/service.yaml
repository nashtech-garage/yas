apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.metricPort }}
      targetPort: http-metric
      protocol: TCP
      name: http-metric
  selector:
    {{- include "backend.selectorLabels" . | nindent 4 }}
