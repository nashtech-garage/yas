name: media service ci

on:
  push:
    branches: ["**"]
    paths:
      - "media/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/media-ci.yaml"
      - "pom.xml"
  pull_request:
    branches: ["main"]
    paths:
      - "media/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/media-ci.yaml"
      - "pom.xml"
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  pull-requests: write
  packages: write

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/workflows/actions

      - name: Run Maven Build Command
        run: mvn clean install -pl media -am -DskipTests

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets-media
          path: |
            media/target/*.jar
            media/target/classes/
            media/target/generated-sources/
          retention-days: 1

      - name: Run Maven Checkstyle
        run: mvn checkstyle:checkstyle -pl media -am -Dcheckstyle.output.file=media-checkstyle-result.xml

      - name: Upload Checkstyle Result
        uses: jwgmeligmeyling/checkstyle-github-action@master
        with:
          path: '**/media-checkstyle-result.xml'

  Test:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/actions

      - name: Run Unit Tests & Generate JaCoCo Report
        run: |
          mvn clean verify \
          org.jacoco:jacoco-maven-plugin:0.8.14:prepare-agent \
          test \
          org.jacoco:jacoco-maven-plugin:0.8.14:report \
          -pl media -am -DskipTests=false

      - name: Test Results Summary (Tab)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Media-Unit-Test-Results
          path: "media/**/*-reports/TEST*.xml"
          reporter: java-junit

      - name: Write Test Summary to Job
        if: always()
        run: |
          echo "## Test Result: media" >> $GITHUB_STEP_SUMMARY
          TEST_FILES=$(find media/target/surefire-reports -name "TEST-*.xml" 2>/dev/null || true)
          if [ -z "$TEST_FILES" ]; then
            echo "No test result files found." >> $GITHUB_STEP_SUMMARY
          else
            TOTAL_TESTS=0; TOTAL_FAILURES=0; TOTAL_ERRORS=0; TOTAL_SKIPPED=0
            for FILE in $TEST_FILES; do
              TESTS=$(grep -oE 'tests="[0-9]+"' "$FILE" | cut -d'"' -f2 | head -1)
              FAILURES=$(grep -oE 'failures="[0-9]+"' "$FILE" | cut -d'"' -f2 | head -1)
              ERRORS=$(grep -oE 'errors="[0-9]+"' "$FILE" | cut -d'"' -f2 | head -1)
              SKIPPED=$(grep -oE 'skipped="[0-9]+"' "$FILE" | cut -d'"' -f2 | head -1)
              TOTAL_TESTS=$((TOTAL_TESTS + TESTS))
              TOTAL_FAILURES=$((TOTAL_FAILURES + FAILURES))
              TOTAL_ERRORS=$((TOTAL_ERRORS + ERRORS))
              TOTAL_SKIPPED=$((TOTAL_SKIPPED + SKIPPED))
            done
            TOTAL_PASSED=$((TOTAL_TESTS - TOTAL_FAILURES - TOTAL_ERRORS - TOTAL_SKIPPED))
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $TOTAL_PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | $TOTAL_FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $TOTAL_ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| Skipped | $TOTAL_SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$TOTAL_TESTS** |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Jacoco Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-media
          path: media/target/site/jacoco/jacoco.xml
          retention-days: 1

  Docker:
    needs: [Build, Test]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ghcr.io/nashtech-garage/yas-media
      IMAGE_TAG: sha-${{ github.sha }}
      VALUES_FILE: k8s/charts/media/values.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: ./.github/workflows/actions

      - name: Prepare Docker build artifact
        run: mvn clean package -pl media -am -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./media
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPOSITORY }}:latest

      - name: Update Helm image tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["VALUES_FILE"])
          tag = os.environ["IMAGE_TAG"]
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          in_image = False
          image_indent = None
          updated = False

          for index, line in enumerate(lines):
              stripped = line.strip()
              indent = len(line) - len(line.lstrip())

              if stripped == "image:":
                  in_image = True
                  image_indent = indent
                  continue

              if not in_image:
                  continue

              if stripped and indent <= image_indent:
                  in_image = False
                  image_indent = None
                  continue

              if stripped.startswith("tag:"):
                  prefix = line[:indent]
                  newline = "\r\n" if line.endswith("\r\n") else "\n" if line.endswith("\n") else ""
                  lines[index] = prefix + "tag: " + tag + newline
                  updated = True
                  break

          if not updated:
              raise SystemExit("Could not find image.tag in " + str(path))

          path.write_text("".join(lines), encoding="utf-8")
          print("Updated " + str(path) + " image tag to " + tag)
          PY

      - name: Commit updated image tag
        run: |
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"

          if git diff --quiet -- "$VALUES_FILE"; then
            echo "No Helm values change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "ci: update media image tag to $IMAGE_TAG"

          for attempt in 1 2 3; do
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push failed, rebasing and retrying ($attempt/3)."
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep $((attempt * 5))
          done

          exit 1

  SonarCloud:
    needs: [Build, Test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/actions

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-assets-media

      - name: Download Jacoco Report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-media
          path: media/target/site/jacoco/

      - name: Analyze with sonar cloud
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -pl media -am -f pom.xml
          -Dsonar.coverage.jacoco.xmlReportPaths=media/target/site/jacoco/jacoco.xml

      - name: SonarCloud Summary
        if: always()
        run: |
          if [ "${{ steps.sonar.outcome }}" = "success" ]; then ICON="PASS"; else ICON="FAIL"; fi
          echo "## SonarCloud Report: media" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | **$ICON** |" >> $GITHUB_STEP_SUMMARY
          echo "### Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "https://sonarcloud.io/dashboard?id=<YOUR_PROJECT_KEY>" >> $GITHUB_STEP_SUMMARY

  Check-Coverage:
    needs: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Jacoco Report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-media
          path: target/jacoco-results

      - name: Add coverage report to PR
        id: jacoco_report
        if: github.event.before != '0000000000000000000000000000000000000000'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{ github.workspace }}/target/jacoco-results/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 60
          title: 'Media Coverage Report'
          update-comment: false

      - name: Write Coverage Summary
        if: always()
        run: |
          COVERAGE="${{ steps.jacoco_report.outputs.coverage-overall }}"
          CHANGED="${{ steps.jacoco_report.outputs.coverage-changed-files }}"
          [ -z "$COVERAGE" ] && COVERAGE=0
          [ -z "$CHANGED" ] && CHANGED=0
          THRESHOLD=70
          if (( $(echo "$COVERAGE >= $THRESHOLD" | bc -l) )); then STATUS="PASSED"; else STATUS="FAILED"; fi

          echo "## Coverage Summary: media" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Overall Coverage | $COVERAGE% | $THRESHOLD% | $STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Changed Files | $CHANGED% | 60% | - |" >> $GITHUB_STEP_SUMMARY

      - name: Enforce Threshold
        run: |
          THRESHOLD=70
          COVERAGE=${{ steps.jacoco_report.outputs.coverage-overall }}
          if (( $(echo "$COVERAGE <= $THRESHOLD" | bc -l) )); then
            echo "Code coverage ($COVERAGE%) is lower than required ($THRESHOLD%)."
            exit 1
          fi
