name: product service ci

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: ["**"]
    paths:
      - "product/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/product-ci.yaml"
      - "pom.xml"

  pull_request:
    branches: ["main"]
    paths:
      - "product/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/product-ci.yaml"
      - "pom.xml"

  workflow_dispatch:

jobs:
  test:
    name: Phase 1 - Test
    runs-on: ubuntu-latest

    env:
      FROM_ORIGINAL_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java and Maven cache
        uses: ./.github/workflows/actions

      # Chạy unit test, tạo JaCoCo report và kiểm tra ngưỡng coverage.
      # Nếu instruction coverage dưới 70%, lệnh này sẽ thất bại.
      - name: Run unit tests and enforce 70 percent coverage
        run: mvn -B -ntp clean verify -pl product -am

      - name: Run Maven Checkstyle
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        run: >
          mvn -B -ntp checkstyle:checkstyle
          -pl product
          -am
          -Dcheckstyle.output.file=product-checkstyle-result.xml

      - name: Upload Checkstyle Result
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: jwgmeligmeyling/checkstyle-github-action@master
        with:
          path: "**/product-checkstyle-result.xml"

      # Luôn upload report, kể cả khi test hoặc coverage thất bại.
      - name: Upload Test and Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Product-Service-Reports
          path: |
            product/target/surefire-reports/
            product/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

      - name: Test Results
        if: ${{ always() && env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: dorny/test-reporter@v1
        with:
          name: Product-Service-Unit-Test-Results
          path: "product/**/*-reports/TEST*.xml"
          reporter: java-junit

      - name: Analyze with SonarCloud
        if: ${{ success() && env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -f product

      # always() giúp report vẫn được comment lên PR khi coverage dưới 70%.
      - name: Add coverage report to PR
        if: ${{ always() && github.event_name == 'pull_request' && env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{ github.workspace }}/product/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 60
          title: "Product Coverage Report"
          update-comment: true
          continue-on-error: false

  build:
    name: Phase 2 - Build
    runs-on: ubuntu-latest

    # Phase Build chỉ chạy nếu toàn bộ Phase Test thành công.
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java and Maven cache
        uses: ./.github/workflows/actions

      - name: Build Product service
        run: mvn -B -ntp clean package -pl product -am -DskipTests

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: Product-Service-JAR
          path: product/target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Log in to the Container registry
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          context: ./product
          push: true
          tags: ghcr.io/vybui13/yas-product:latest