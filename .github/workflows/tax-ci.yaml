name: tax service ci

on:
  push:
    branches: [ "main" ]
    paths:
      - "tax/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/tax-ci.yaml"
      - "pom.xml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "tax/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/tax-ci.yaml"
      - "pom.xml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FROM_ORIGINAL_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/actions
      - name: Run Maven Checkstyle
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        run: mvn checkstyle:checkstyle -pl tax -am -Dcheckstyle.output.file=tax-checkstyle-result.xml
      - name: Upload Checkstyle Result
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: jwgmeligmeyling/checkstyle-github-action@master
        with:
          path: '**/tax-checkstyle-result.xml'
      - name: Run Maven Verify
        run: mvn clean verify -pl tax -am
      - name: Check test reports
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        id: test_reports
        shell: bash
        run: |
          if find "${{ github.workspace }}/tax" -path '*-reports/TEST*.xml' -print -quit | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test Results
        uses: dorny/test-reporter@v1
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' && steps.test_reports.outputs.exists == 'true' && (success() || failure()) }}
        with:
          name: Tax-Service-Unit-Test-Results
          path: "tax/**/*-reports/TEST*.xml"
          reporter: java-junit
      - name: OWASP Dependency Check
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'yas'
          path: '.'
          format: 'HTML'
      - name: Upload OWASP Dependency Check results
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: actions/upload-artifact@master
        with:
          name: OWASP Dependency Check Report
          path: ${{github.workspace}}/reports
      - name: Check coverage report
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        id: coverage
        shell: bash
        run: |
          if [ -f "${{ github.workspace }}/tax/target/site/jacoco/jacoco.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Add coverage report to PR
        uses: madrapps/jacoco-report@v1.6.1
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' && steps.coverage.outputs.exists == 'true' }}
        with:
          paths: ${{github.workspace}}/tax/target/site/jacoco/jacoco.xml
          token: ${{secrets.GITHUB_TOKEN}}
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          title: 'Tax Coverage Report'
          update-comment: true

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/actions
      - name: Run Maven Build Command
        run: mvn clean package -DskipTests -pl tax -am
      - name: Prepare image owner
        id: image_owner
        shell: bash
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./tax
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.image_owner.outputs.value }}/yas-tax:latest
