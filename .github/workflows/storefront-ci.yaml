name: storefront service ci

on:
  push:
    branches: ["**"]
    paths:
      - "storefront/**"
      - ".github/workflows/storefront-ci.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "storefront/**"
      - ".github/workflows/storefront-ci.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FROM_ORIGINAL_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: storefront

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: storefront

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: storefront-coverage-report
          path: storefront/coverage/

      - name: Add coverage report to PR
        uses: romeovs/lcov-reporter-action@v0.4.0
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' && github.event_name == 'pull_request' }}
        with:
          lcov-file: storefront/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Storefront Coverage Report'

      - name: Gitleaks check (Service Level)
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work zricethezav/gitleaks:v8.18.4 detect --source="./storefront" --no-git --verbose

  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      FROM_ORIGINAL_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: storefront

      - name: Run lint
        run: npm run lint
        working-directory: storefront

      - name: Run build
        run: npm run build
        working-directory: storefront
        env:
          NEXT_PUBLIC_API_BASE_PATH: https://api.yas.local

      - name: SonarCloud Scan
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: storefront
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Setup Snyk
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: snyk/actions/setup@master
      - name: Snyk Security Scan
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=storefront/package.json --severity-threshold=high --project-name=yas-storefront

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set Docker Tag
        if: github.event_name != 'pull_request'
        id: docker_tag
        run: |
          COMMIT_ID=$(echo ${{ github.sha }} | cut -c1-7)
          echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            echo "TAG=$COMMIT_ID" >> $GITHUB_ENV
          fi

      - name: Build and push Docker images
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./storefront
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yas-storefront:${{ env.COMMIT_ID }}
            ${{ secrets.DOCKERHUB_USERNAME }}/yas-storefront:${{ env.TAG }}

      - name: Update GitOps Repository (Cross-Repo)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/${{ github.repository_owner }}/yas-gitops.git
          cd yas-gitops
          git config --global user.email "bot@github.com"
          git config --global user.name "GitOps Bot"
          sed -i 's/storefront: { tag: .* }/storefront: { tag: "${{ env.COMMIT_ID }}" }/g' values-dev.yaml
          git add values-dev.yaml
          git commit -m "ArgoCD: Update storefront dev tag to ${{ env.COMMIT_ID }}"
          git push origin main
