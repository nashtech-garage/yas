name: sonarcloud

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backoffice/package-lock.json
            storefront/package-lock.json

      - name: Build Java modules
        run: mvn -B clean install -DskipTests

      - name: Install storefront dependencies
        run: npm ci
        working-directory: storefront

      - name: Build storefront
        run: npm run build
        working-directory: storefront

      - name: Install backoffice dependencies
        run: npm ci
        working-directory: backoffice

      - name: Build backoffice
        run: npm run build
        working-directory: backoffice

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
