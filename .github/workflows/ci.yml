name: Monorepo CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**' # Quét và chạy pipeline cho tất cả các branch khi có PR (Yêu cầu 4)

jobs:
  # Job này dùng để detect xem những service nào có sự thay đổi code (Yêu cầu 6)
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      media: ${{ steps.filter.outputs.media }}
      storefront: ${{ steps.filter.outputs.storefront }}
      cart: ${{ steps.filter.outputs.cart }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            media:
              - 'media/**'
            storefront:
              - 'storefront/**'
            cart:
              - 'cart/**'

  # Pipeline cho service Media (Java/Maven)
  ci-media:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.media == 'true' }} # Chỉ chạy khi thư mục media/ có thay đổi (Yêu cầu 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Phase 1: Test (Yêu cầu 5)
      - name: Test Media Service
        run: ./mvnw -pl media -am test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-test-results
          path: media/target/surefire-reports/

      - name: Upload Jacoco Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-coverage
          path: media/target/site/jacoco/

      # Phase 2: Build (Yêu cầu 5)
      - name: Build Media Service
        run: ./mvnw -pl media -am clean package -DskipTests

  # Pipeline cho service Storefront (NodeJS/NextJS)
  ci-storefront:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.storefront == 'true' }} # Chỉ chạy khi thư mục storefront/ có thay đổi (Yêu cầu 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        working-directory: ./storefront
        run: npm ci

      # Phase 1: Test (Yêu cầu 5)
      - name: Test Storefront
        working-directory: ./storefront
        run: npm run test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-test-results
          path: storefront/coverage/

      # Phase 2: Build (Yêu cầu 5)
      - name: Build Storefront
        working-directory: ./storefront
        run: npm run build
