name: Pull Request CI

on:
    pull_request:
        branches:
            - main
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

jobs:
    detect-changes:
        name: Detect changed services
        runs-on: ubuntu-24.04

        outputs:
            matrix: ${{ steps.changes.outputs.matrix }}
            has_changes: ${{ steps.changes.outputs.has_changes }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Detect changed services
              id: changes
              shell: bash
              run: |
                  ./scripts/detect-changed-services.sh \
                      "${{ github.event.pull_request.base.sha }}" \
                      "${{ github.event.pull_request.head.sha }}"

    test-services:
        name: Test ${{ matrix.service }}
        needs: detect-changes

        if: needs.detect-changes.outputs.has_changes == 'true'

        runs-on: ubuntu-24.04

        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Java 25
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven

            - name: Test service
              shell: bash
              run: mvn -B -pl "${{ matrix.service }}" -am test

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports-${{ matrix.service }}-${{ github.event.pull_request.head.sha }}
                  path: |
                      ${{ matrix.service }}/target/surefire-reports/
                      ${{ matrix.service }}/target/failsafe-reports/
                  if-no-files-found: warn
                  retention-days: 7