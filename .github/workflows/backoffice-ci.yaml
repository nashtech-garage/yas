name: backoffice service ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.filter.outputs.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            service:
              - 'backoffice/**'
              - '.github/workflows/backoffice-ci.yaml'

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps
        working-directory: backoffice

      - name: Build
        run: npm run build
        working-directory: backoffice

      - name: Lint
        run: npm run lint
        working-directory: backoffice

      - name: Format Check
        run: npx prettier --check .
        working-directory: backoffice

      - name: Run Unit Tests & Generate Coverage Report
        run: npm run test:coverage -- --ci
        working-directory: backoffice

      - name: Code Coverage Quality Gate (Console)
        run: |
          SUMMARY="backoffice/coverage/coverage-summary.json"
          if [ -f "$SUMMARY" ]; then
            node -e "
              const s = require('./$SUMMARY').total;
              const overall = Math.min(s.lines.pct, s.functions.pct, s.branches.pct, s.statements.pct);
              const pct = parseFloat(overall).toFixed(2);
              process.stdout.write('===========================================\n');
              process.stdout.write(' BACKOFFICE SERVICE COVERAGE: ' + pct + '%\n');
              process.stdout.write('===========================================\n');
              if (overall < 70) {
                process.stdout.write(' FAILED: Coverage below minimum 70%\n');
                process.exit(1);
              }
            "
          else
            echo "::error::coverage-summary.json not found. Check Jest configuration!"
            exit 1
          fi

      - name: Add Coverage Report to PR
        uses: madrapps/jacoco-report@v1.7.1
        if: github.event_name == 'pull_request'
        with:
          paths: ${{ github.workspace }}/backoffice/coverage/cobertura-coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Backoffice Service Coverage Report
          min-coverage-overall: 70

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backoffice-coverage-report
          path: backoffice/coverage/

  security:
    needs:
      - detect-changes
      - test
    if: needs.detect-changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Test & Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backoffice-coverage-report
          path: backoffice/coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backoffice
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=trnhduong
            -Dsonar.projectKey=TrNhDuong_yas_devops 
            -Dsonar.sources=common,constants,modules,pages,utils
            -Dsonar.tests=__tests__
            -Dsonar.test.inclusions=__tests__/**/*.test.ts,__tests__/**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=coverage/**,node_modules/**,public/**,.next/**


  build:
    concurrency:
      group: gitops-update-main
      cancel-in-progress: false
    needs:
      - detect-changes
      - security
    if: needs.detect-changes.outputs.service == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and push Docker image to Docker Hub
        id: docker_build
        uses: ./.github/workflows/actions/docker-build-push
        with:
          context: ./backoffice
          image-name: yas-backoffice
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Update image tag in GitOps repository
        if: github.event_name != 'pull_request'
        uses: ./.github/workflows/actions/gitops-update-image-tag
        with:
          image-name: yas-backoffice
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          image-tag: ${{ steps.docker_build.outputs.image_tag }}
          source-branch: ${{ github.ref_name }}
          gitops-repository: Duong-Dung/yas-gitops
          gitops-branch: main
          gitops-token: ${{ secrets.GITOPS_PAT }}
