name: {{SERVICE_NAME}} service ci

on:
  push:
    branches: [ "**" ] # Chạy CI trên mọi branch (Yêu cầu 4)
    paths:
      - "{{SERVICE_NAME}}/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/{{SERVICE_NAME}}-ci.yaml"
      - "pom.xml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "{{SERVICE_NAME}}/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/{{SERVICE_NAME}}-ci.yaml"
      - "pom.xml"
  workflow_dispatch:

jobs:
  # ==========================================
  # PHASE 1: TEST
  # ==========================================
  Test:
    runs-on: ubuntu-latest
    env:
      FROM_ORIGINAL_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      
      - name: Set up JDK 21
        uses: ./.github/workflows/actions
      
      # Chạy Test cho service cụ thể
      - name: Run Maven Test Command
        run: mvn clean test -pl {{SERVICE_NAME}} -am

      # Build library cần thiết để tránh lỗi phụ thuộc (dependency)
      - name: Pre-build dependencies
        run: mvn clean install -DskipTests -am -pl {{SERVICE_NAME}}

      # Upload Test Results đẹp mắt lên PR
      - name: Unit Test Results
        uses: dorny/test-reporter@v1
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' && (success() || failure()) }}
        with:
          name: {{SERVICE_NAME}}-Unit-Test-Results
          path: "{{SERVICE_NAME}}/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          
      # Phân tích chất lượng code với SonarCloud (Yêu cầu 7c)
      - name: Analyze with sonar cloud
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -f {{SERVICE_NAME}}

      # Quét lỗ hổng bảo mật với Snyk (Yêu cầu 7c)
      - name: Snyk Security Scan
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: {{SERVICE_NAME}}/pom.xml
          args: --severity-threshold=high

      # Quét thư viện lỗi thời với OWASP (Yêu cầu 7c)
      - name: OWASP Dependency Check
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'yas'
          path: '.'
          format: 'HTML'
          
      - name: Upload OWASP results
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: {{SERVICE_NAME}}-OWASP-Report
          path: ${{github.workspace}}/reports

      # Báo cáo độ phủ Test và chặn PR nếu < 70% (Yêu cầu 7b)
      - name: Add coverage report to PR
        uses: madrapps/jacoco-report@v1.6.1
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        with:
          paths: ${{github.workspace}}/{{SERVICE_NAME}}/target/site/jacoco/jacoco.xml
          token: ${{secrets.GITHUB_TOKEN}}
          min-coverage-overall: 70
          min-coverage-changed-files: 60
          title: '{{SERVICE_NAME}} Coverage Report'
          update-comment: true

  # ==========================================
  # PHASE 2: BUILD
  # ==========================================
  Build:
    needs: Test # Chỉ chạy khi Phase Test thành công (Yêu cầu 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: ./.github/workflows/actions
      
      # Đóng gói ứng dụng
      - name: Run Maven Build Command
        run: mvn clean package -DskipTests -pl {{SERVICE_NAME}} -am

      - name: Log in to the Container registry
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker images
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          context: ./{{SERVICE_NAME}}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yas-{{SERVICE_NAME}}:latest